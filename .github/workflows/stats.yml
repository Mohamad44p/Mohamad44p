name: Redraw the stats card

on:
  schedule:
    - cron: "17 3 * * *" # every day, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: redraw the stats card"
          git push
